apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-app
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: spring-app
  template:
    metadata:
      labels:
        app: spring-app
    spec:
      containers:
        - name: spring-app
          image: gadour95/docker-spring-10:latest # sera remplacé automatiquement par Jenkins
          ports:
            - containerPort: 8083 # ← changé ici
          env:
            - name: SERVER_PORT
              value: "8083"
